<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Mockup</title>
</head>
<body>

    <!-- เรียกใช้ Custom Element หน้าจอมือถือ -->
    <phone-mockup model="William PHONE" color="black">
        <!-- เนื้อหาบนหน้าจอมือถือ -->
        <div style="height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; color: white; background: #111;">
            
            <div style="text-align: center; margin-top: 30px;">
                <h1 style="font-size: 48px; margin: 0;">12:00</h1>
                <p>วันอาทิตย์ที่ 25 ตุลาคม</p>
            </div>

            <div style="display: flex; justify-content: space-around; margin-bottom: 20px;">
                <label style="cursor: pointer;">
  🖼️ รูปภาพ
  <input type="file" accept="image/*" style="display: none;" onchange="console.log(event.target.files[0])">
</label>
<div style="border-radius: 12px;">🎵 เพลง</div>
<div style="border-radius: 12px;">📝 โน้ต</div>

            </div>

        </div>
    </phone-mockup>

    <script>
        class PhoneMockupElement extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({mode: 'open'});
            }
            connectedCallback() {
                const model = this.getAttribute('model') || '';
                const color = this.getAttribute('color') || 'black';
                this.shadowRoot.innerHTML = `
                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

                    .pm-w.black { --bg: #24292e; --ts: #000; --tnc: #fff; --tc: #eee; --gc1: #272c31; --gc2: #202529; --gc3: #0e1012; --gc4: #0e1012; --gc5: #3a424a; --b1: #161a1d; --b2: #3b4147; --b3: #202529; --b4: #282d31; --b5: #161a1d; --b6: #161a1d; }
                    .pm-w.white { --bg: #C9CFD4; --ts: #fff; --tnc: #171717; --tc: #000; --gc1: #D6D9DD; --gc2: #9EA6AC; --gc3: #899097; --gc4: #90969C; --gc5: #CFD4DA; --b1: #8E959B; --b2: #D2D7DD; --b3: #9DA7AF; --b4: #B7BBBE; --b5: #747E85; --b6: #7C7F81; }

                    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
                    .pm-w { background-color: var(--bg); color: var(--tc); position: fixed; top: 0; left: 0; height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; flex-direction: column; }
                    .pm-n { padding: 25px; font-size: 1.5em; text-shadow: 0 5px 5px var(--ts); color: var(--tnc); }
                    .pm { background: linear-gradient(145deg, var(--gc1), var(--gc2)); box-shadow: 0 0 100px var(--gc3), inset -5px -5px 10px var(--gc4), inset 5px 5px 10px var(--gc5); position: relative; height: 730px; width: 380px; display: flex; align-items: center; justify-content: center; border-radius: 50px; }
                    .pm-s { border-radius: 20px; height: 640px; width: 360px; overflow: hidden; background: #000; }
                    .pm-a-t { position: absolute; height: 6px; width: 100px; border-radius: 8px; top: 20px; left: calc(50% - 50px); box-shadow: 0 0 5px var(--b1) inset; }
                    .pm-b-su, .pm-b-sd { background: linear-gradient(90deg, var(--b2), var(--b3)); position: absolute; height: 70px; width: 3px; border-top-left-radius: 5px; border-bottom-left-radius: 5px; left: -3px; }
                    .pm-b-su { top: 150px; } .pm-b-sd { top: 225px; }
                    .pm-b-p { background: linear-gradient(-90deg, var(--b4), var(--b5)); top: 190px; position: absolute; height: 50px; width: 3px; border-top-right-radius: 5px; border-bottom-right-radius: 5px; right: -3px; }
                    .pm-b-b { box-shadow: 0 0 5px var(--b6) inset; position: absolute; height: 28px; width: 60px; border-radius: 8px; bottom: 9px; left: calc(50% - 30px); }
                </style>
                <div class="pm-w ${color}">
                    <div class="pm">
                        <div class="pm-b-w">
                            <div class="pm-a-t"></div>
                            <div class="pm-b-su"></div>
                            <div class="pm-b-sd"></div>
                            <div class="pm-b-b"></div>
                            <div class="pm-b-p"></div>
                        </div>
                        <div class="pm-s">
                            <slot></slot>
                        </div>
                    </div>
                    <div class="pm-n">${model}</div>
                </div>
                `;
            }
        }
        window.customElements.define('phone-mockup', PhoneMockupElement);
    </script>
</body>
</html>

<!-- 1. ส่วนหน้าจอล็อก (มีเวลา, ชื่อศิลปิน และช่องใส่รหัสผ่าน) -->
<div style="text-align: center; padding: 25px 20px; background: #111; color: white; border-radius: 20px; margin-bottom: 15px;">
  <h2 style="margin: 0; font-size: 32px; font-weight: 300;">14:19</h2>
  <p style="margin: 5px 0 15px 0; font-size: 13px; opacity: 0.7;">WilliamEst</p>
  
  <!-- จำลองจุดใส่รหัสผ่าน 4 จุด -->
  <div style="display: flex; justify-content: center; gap: 12px; margin: 15px 0;">
    <div style="width: 12px; height: 12px; border: 2px solid white; border-radius: 50%;"></div>
    <div style="width: 12px; height: 12px; border: 2px solid white; border-radius: 50%;"></div>
    <div style="width: 12px; height: 12px; border: 2px solid white; border-radius: 50%;"></div>
    <div style="width: 12px; height: 12px; border: 2px solid white; border-radius: 50%;"></div>
  </div>
  <p style="font-size: 11px; opacity: 0.5; margin-bottom: 15px;">1419</p>

  <!-- พื้นที่แสดงรูปภาพหลักเมื่อกดเลือกรูป -->
  <img id="show-img" src="" style="max-width: 100%; max-height: 220px; border-radius: 15px; display: none; margin: 10px auto; box-shadow: 0 4px 10px rgba(255,255,255,0.2);">
</div>

<!-- 2. แถบรวมไอคอนแอป (LINE, IG, Apple Music, โทร, รูปภาพ, ปฏิทิน) -->
<div style="display: flex; justify-content: space-around; align-items: center; padding: 15px; background: #fff; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto;">

  <!-- LINE -->
  <a href="https://line.me" target="_blank" style="text-decoration: none; text-align: center; flex-shrink: 0; margin: 0 5px;">
    <div style="background: #06C755; color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin: 0 auto 4px auto;">💬</div>
    <span style="font-size: 10px; color: #333;">LINE</span>
  </a>

  <!-- IG -->
  <a href="https://instagram.com" target="_blank" style="text-decoration: none; text-align: center; flex-shrink: 0; margin: 0 5px;">
    <div style="background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin: 0 auto 4px auto;">📸</div>
    <span style="font-size: 10px; color: #333;">IG</span>
  </a>

  <!-- Apple Music -->
  <a href="https://music.apple.com" target="_blank" style="text-decoration: none; text-align: center; flex-shrink: 0; margin: 0 5px;">
    <div style="background: linear-gradient(135deg, #fa233b, #fb556e); color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin: 0 auto 4px auto;">🎵</div>
    <span style="font-size: 10px; color: #333;">Music</span>
  </a>

  <!-- โทร -->
  <a href="tel:" style="text-decoration: none; text-align: center; flex-shrink: 0; margin: 0 5px;">
    <div style="background: #2ed573; color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin: 0 auto 4px auto;">📞</div>
    <span style="font-size: 10px; color: #333;">โทร</span>
  </a>

  <!-- รูปภาพ (กดเลือกรูปจากเครื่อง) -->
  <label style="cursor: pointer; text-align: center; flex-shrink: 0; margin: 0 5px;">
    <div style="background: #ff4757; color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin: 0 auto 4px auto;">🖼️</div>
    <span style="font-size: 10px; color: #333;">รูปภาพ</span>
    <input type="file" accept="image/*" onchange="document.getElementById('show-img').src = window.URL.createObjectURL(this.files[0]); document.getElementById('show-img').style.display = 'block';" style="display: none;">
  </label>

  <!-- ปฏิทิน -->
  <label style="cursor: pointer; text-align: center; position: relative; flex-shrink: 0; margin: 0 5px;">
    <div style="background: #ffa502; color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; margin: 0 auto 4px auto;">📅</div>
    <span style="font-size: 10px; color: #333;">ปฏิทิน</span>
    <input type="date" style="position: absolute; opacity: 0; width: 100%; height: 100%; top: 0; left: 0; cursor: pointer;">
  </label>

</div>
